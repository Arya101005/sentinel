services:
  backend:
    build: ./backend
    container_name: fdr-sentinel-backend
    environment:
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      # SQLite on the mounted volume by default; point at Postgres for production.
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/fdr_sentinel.db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      SCHEDULER_ENABLED: "true"
    volumes:
      - backend_data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    container_name: fdr-sentinel-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  backend_data:
